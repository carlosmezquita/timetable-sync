[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timetable-sync"
version = "0.1.0"
description = "Safe preference-aware iCalendar to Outlook reconciliation"
requires-python = ">=3.10"
dependencies = ["icalendar>=6.3,<7", "recurring-ical-events>=3.8,<4", "httpx>=0.28,<0.29", "msal>=1.34,<2", "cryptography>=45,<47", "python-dotenv>=1.2,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
timetable-sync = "timetable_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
